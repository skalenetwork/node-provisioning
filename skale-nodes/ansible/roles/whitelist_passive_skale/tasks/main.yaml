- name: Whitelist passive node IPs in SyncManager
  script: whitelist_passive_skale.py
  environment:
    ETH_PRIVATE_KEY: "{{ eth_private_key }}"
    ENDPOINT: "{{ endpoint }}"
    MANAGER_CONTRACTS: "{{ manager_contracts }}"
    ALLOWED_TS_DIFF: "{{ allowed_ts_diff }}"
    NODE_IPS: "{{ dict(groups['nodes'] | zip(groups['nodes'] | map('extract', hostvars, 'ansible_host'))) | to_json }}"
  args:
    executable: "{{ ansible_playbook_python }}"
