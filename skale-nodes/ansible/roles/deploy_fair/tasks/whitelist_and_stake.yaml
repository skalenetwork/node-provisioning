- name: Execute whitelist_and_stake script
  script: whitelist_and_stake.py
  environment:
    BASE_DIR: "files"
    WEI_AMOUNT: "10000000000000000"
    ETH_PRIVATE_KEY: "{{ eth_private_key }}"
    ENDPOINT: "{{ boot_endpoint }}"
    FAIR_CONTRACTS: "{{ fair_contracts }}"
  args:
    executable: python3