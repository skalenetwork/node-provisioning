- name: Set Skale Manager contract address
  import_role:
    name: set_manager_contracts

- name: Cleanup contracts
  script: cleanup_contracts.py
  run_once: yes
  environment:
    BASE_DIR: "files"
    ETH_PRIVATE_KEY: "{{ eth_private_key }}"
    ENDPOINT: "{{ endpoint }}"
    MANAGER_CONTRACTS: "{{ manager_contracts }}"
  args:
    executable: python3
  tags:
    - cleanup
    - cleanup_contracts
