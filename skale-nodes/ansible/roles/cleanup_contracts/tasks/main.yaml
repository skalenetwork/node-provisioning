- name: Cleanup contracts
  script: cleanup_contracts.py
  run_once: yes
  environment:
    BASE_DIR: "files"
    ETH_PRIVATE_KEY: "{{ eth_private_key }}"
    ENDPOINT: "{{ endpoint }}"
    MANAGER_CONTRACTS: "{{ hostvars['localhost']['sm_address'] }}"
  args:
    executable: python3
  tags:
    - cleanup
    - cleanup_contracts
