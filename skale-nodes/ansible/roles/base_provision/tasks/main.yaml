- import_tasks: ssh_keys.yaml
  tags: ssh

- import_tasks: swap.yaml
  tags: swap

- name: Set soft ulimits
  pam_limits:
    domain: root
    limit_type: soft
    limit_item: core
    value: "1000000000"
  tags: ulimits

- name: Set hard ulimits
  pam_limits:
    domain: root
    limit_type: hard
    limit_item: core
    value: "1000000000"
  tags: ulimits

- name: Install packages
  apt:
    name: [ca-certificates, curl, iptables-persistent]
    state: latest
    update_cache: true
  tags: apt

- import_tasks: docker.yaml
  tags: docker

- name: Enable timesyncd service
  systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  tags: ntp

- name: Disable IPv6 in UFW configuration
  ansible.builtin.replace:
    path: /etc/default/ufw
    regexp: '^IPV6=yes'
    replace: 'IPV6=no'
    backup: yes
