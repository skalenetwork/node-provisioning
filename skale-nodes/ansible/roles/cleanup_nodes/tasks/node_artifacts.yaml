- name: Remove .skale directory
  become: true
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "{{ base_path }}/.skale"
    - "{{ base_path }}/init-env"

- name: Unmount schains directory
  ansible.builtin.mount:
    path: /var/lib/skale/schains
    state: unmounted

- name: Remove schains directory
  file:
    path: /var/lib/skale/schains
    state: absent

- name: Remove node artifacts from /var and /etc
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - "/etc/skale"
    - "/var/lib/skale"

- name: Remove node-cli binary
  file:
    path: "/usr/local/bin/skale"
    state: absent

- name: Remove iptables rules
  ansible.builtin.iptables:
    chain: "{{ item }}"
    flush: yes
  with_items: ["INPUT", "FORWARD", "OUTPUT"]

- name: Load firewall rules from configuration file
  ansible.builtin.command:
    cmd: "nft -f /etc/nftables.conf"
  register: nft_load_result
  tags: cleanup_firewall
