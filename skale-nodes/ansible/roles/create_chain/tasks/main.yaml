- name: Execute create_chain script
  script: create_chain.py
  environment:
    BASE_DIR: "files"
    ETH_PRIVATE_KEY: "{{ eth_private_key }}"
    ENDPOINT: "{{ endpoint }}"
    MANAGER_CONTRACTS: "{{ manager_contracts }}"
    CHAIN_NAME: "{{ chain_name }}"
    CHAIN_TYPE: "{{ chain_type }}"
    ALLOWED_TS_DIFF: "{{ allowed_ts_diff }}"
  args:
    executable: "{{ ansible_playbook_python }}"
  tags: create_chain
