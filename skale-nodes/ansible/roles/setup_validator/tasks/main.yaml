- name: Execute setup_validator script
  script: setup_validator.py
  environment:
    BASE_DIR: "files"
    ETH_AMOUNT: "0.2"
    ETH_PRIVATE_KEY: "{{ eth_private_key }}"
    ENDPOINT: "{{ endpoint }}"
    MIN_DELEGATION_AMOUNT: "0"
    MANAGER_CONTRACTS: "{{ manager_contracts }}"
    COMMISSION_RATE: "1"
    ALLOWED_TS_DIFF: "{{ allowed_ts_diff }}"
  args:
    executable: "{{ ansible_playbook_python }}"
