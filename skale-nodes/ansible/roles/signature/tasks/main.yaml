- name: Save folder name for nodes addresses info
  set_fact:
    node_info_dir: "files/node-info"

- name: Create folder for nodes addresses info
  file:
    path: "{{ node_info_dir }}"
    state: directory
    mode: 0755
  delegate_to: localhost

- name: Get validator id
  set_fact:
    validator_id: "{{ lookup('file', 'files/validator-id.txt') }}"

- name: Show Validator Id
  debug:
    msg: "{{ validator_id }}"

- name: Get wallet info output
  command: "sudo {{ node_type }} wallet info -f json"
  register: wallet_cmd_result
  environment:
    LC_ALL: "C.UTF-8"
    LANG: "C.UTF-8"

- name: Get wallet data from json
  set_fact:
    wallet_data: "{{ wallet_cmd_result.stdout | to_json | from_json }}"

- name: Determine signature command based on node_type
  set_fact:
    get_signature_command: >-  # Using >- for multi-line in YAML, processed by Jinja
      {% if node_type == "mirage_boot" %}
      sudo {{ node_type }} boot signature {{ validator_id }}
      {% else %}
      sudo {{ node_type }} node signature {{ validator_id }}
      {% endif %}

- name: Get node signature
  command: "{{ get_signature_command }}"
  register: signature_cmd_result
  changed_when: false

- name: Display node signature
  debug:
    msg: "{{ signature_cmd_result.stdout }}"

- name: Get wallet data from json
  set_fact:
    signature: "{{ signature_cmd_result.stdout.split()[1] }}"

- name: Save address and signature to a file
  copy:
    content: "{{ wallet_data.address}} {{ signature }}"
    dest: "{{ node_info_dir }}/{{ inventory_hostname }}"
  delegate_to: "127.0.0.1"
