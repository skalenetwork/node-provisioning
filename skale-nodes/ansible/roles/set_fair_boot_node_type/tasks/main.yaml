- name: Set node_type to fair_boot
  set_fact:
    node_type: "fair_boot"

- name: Publish node_type to all nodes for subsequent plays
  set_fact:
    node_type: "fair_boot"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['nodes'] }}"
  run_once: true

# fair_migrate removes it once the boot nodes are regular Fair nodes
- name: Save node_type for later runs
  import_role:
    name: generated_vars
    tasks_from: save
  vars:
    generated_vars_save:
      node_type: fair_boot
