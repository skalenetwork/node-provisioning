- name: Determine init command action prefix based on node_type and sync_node
  set_fact:
    _command_action_prefix: >-  
      {% if node_type == "mirage_boot" %}
      mirage boot
      {% elif node_type == "mirage" %}
      mirage node
      {% elif node_type == "skale" %}
        {% if sync_node | default(false) | bool %}
      skale sync-node
        {% else %} {# if sync_node is not defined or false}
      skale node
        {% endif %}
      {% else %}
      "" {# if node_type is unknown #}
      {% endif %}

- name: Fail if command action prefix could not be determined
  fail:
    msg: "Cannot determine init command prefix because node_type is unknown"
  when: _command_action_prefix | length == 0

- name: Set the full CLI init command
  set_fact:
    cli_full_command: "{{ _command_action_prefix }} init {{ base_path }}/init-env"


- name: Add --catchup if needed (SKALE sync node)
  set_fact:
    cli_full_command: "{{ cli_full_command }} --catchup"
  when:
    - node_type == "skale"
    - sync_node is defined and sync_node
    - catchup is defined and catchup

- name: Add --archive if needed (SKALE sync node)
  set_fact:
    cli_full_command: "{{ cli_full_command }} --archive"
  when:
    - node_type == "skale"
    - sync_node is defined and sync_node
    - archive is defined and archive

- name: Add --historic-state if needed (SKALE sync node)
  set_fact:
    cli_full_command: "{{ cli_full_command }} --historic-state"
  when:
    - node_type == "skale"
    - sync_node is defined and sync_node
    - historic_state is defined and historic_state

- name: Show cli_full_command
  debug:
    msg: "{{ cli_full_command }}"

- name: Execute cli_full_command
  command:
    cmd: "{{ cli_full_command }}"
  environment:
    LANG: en_US.utf-8
    LC_ALL: en_US.utf-8

- name: Pause to make sure skale-admin exchange certs with sgx server
  pause:
    seconds: 120
