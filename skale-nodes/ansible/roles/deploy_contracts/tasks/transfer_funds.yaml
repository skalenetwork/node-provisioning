- name: Show anvil_private_key
  debug:
    msg: "{{ anvil_private_key }}"

- name: Set endpoint for anvil
  set_fact:
    endpoint: "http://{{ hostvars[groups['nodes'][0]].ansible_host }}:8545"
  run_once: true
  when: anvil is defined and anvil
  tags: [anvil]

- name: Save endpoint for anvil for later runs
  import_role:
    name: generated_vars
    tasks_from: save
  vars:
    generated_vars_save:
      endpoint: "{{ endpoint }}"
  when: anvil is defined and anvil
  tags: [anvil]

- name: Publish endpoint to all nodes for subsequent plays
  set_fact:
    endpoint: "{{ endpoint }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['nodes'] }}"
  run_once: true
  when: anvil is defined and anvil
  tags: [anvil]

- name: Transfer funds from the base anvil account to main one
  run_once: yes
  tags: anvil_funds
  script: transfer_funds.py
  environment:
    ETH_PRIVATE_KEY: "{{ anvil_private_key }}"
    TARGET_PRIVATE_KEY: "{{ eth_private_key }}"
    ENDPOINT: "{{ endpoint }}"
    BASE_DIR: "files"
    AMOUNT: "{{ anvil_eth_amount | default(10) }}"
    ALLOWED_TS_DIFF: "{{ allowed_ts_diff }}"
  args:
    executable: python3
