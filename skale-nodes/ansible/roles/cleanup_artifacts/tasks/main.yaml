- name: Cleanup node-info folder
  file:
    state: absent
    path: "{{ playbook_dir}}/files/node-info/"
  tags: node_info_cleanup

- name: Cleanup generated values
  import_role:
    name: generated_vars
    tasks_from: remove
  vars:
    generated_vars_drop: "{{ generated_vars_keys }}"
  tags:
    - group_vars_cleanup
    - contract_data_cleanup

- name: Find all abis
  find:
    paths: ["{{ playbook_dir }}/../../helper-scripts/contracts_data"]
    patterns: ["*.json"]
  register: abi_files
  tags: contract_data_cleanup

- name: Cleanup contract abis
  file:
    state: absent
    path: "{{ item.path }}"
  loop: "{{ abi_files.files }}"
  tags: contract_data_cleanup

- name: Cleanup manager manifests
  file:
    state: absent
    path: "{{ playbook_dir }}/../../helper-scripts/contracts_data/openzeppelin"
  tags: contract_data_cleanup

- name: Cleanup ima manifests
  file:
    state: absent
    path: "{{ playbook_dir }}/../../helper-scripts/contracts_data/ima-openzeppelin"
  tags: contract_data_cleanup

- name: Cleanup contracts data
  file:
    state: absent
    path: "{{ playbook_dir }}/../../helper-scripts/contracts_data/.openzeppelin"
  tags: contract_data_cleanup

- name: Remove validator-id and validator-key files
  file:
    path: "{{ item }}"
    state: absent
  with_fileglob:
    - "{{ playbook_dir}}/files/validator-*.txt"
  tags: validator_data_cleanup