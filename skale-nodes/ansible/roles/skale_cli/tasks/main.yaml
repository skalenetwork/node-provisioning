# --- Download binary ---

- name: Download skale_cli from spaces (SKALE CLI)
  get_url:
    url: "{{ skale_cli_url }}"
    dest: "/usr/local/bin/skale"
    force: yes
    mode: "0755"
  when:
    - node_type == "skale"
    - build_type == "git"
  tags: binary

- name: Download mirage_cli from spaces (Mirage CLI)
  get_url:
    url: "{{ mirage_cli_url }}"
    dest: "/usr/local/bin/mirage"
    force: yes
    mode: "0755"
  when:
    - node_type == "mirage_boot"
    - build_type == "git"
  tags: binary


# --- Build binary from source ---

- name: Makedir dist for CLI build
  file:
    state: directory
    path: "{{ base_path }}/node-cli/dist"
  when:
    - build_type == "source"

- name: Remove old binary builder image
  community.docker.docker_image:
    name: "node-cli-builder"
    state: absent
  when:
    - build_type == "source"

- name: Build binary builder image
  community.docker.docker_image_build:
    name: "node-cli-builder"
    network: host
    path: "{{ base_path }}/node-cli"
  when:
    - build_type == "source"

- name: Determine and set build command based on node type
  when: build_type == "source"
  block:
    - name: Determine build target from map with readable keys
      set_fact:
        _build_target: "{{ build_target_map[lookup_key] | default('') }}"
      vars:
        base_node_type: "{{ 'mirage' if node_type == 'mirage_boot' else node_type }}"
        sync_suffix: "{{ 'sync' if (sync_node | default(false) | bool) else 'normal' }}"
        lookup_key: "{{ base_node_type }}_{{ sync_suffix }}"
        build_target_map:
          mirage_normal: "mirage"
          # mirage_sync: "mirage_sync"
          skale_normal: "normal"
          skale_sync: "sync"

    - name: Fail if build target is unknown
      fail:
        msg: "Unsupported combination: node_type={{ node_type }}, sync_node={{ sync_node | default('not defined') }}"
      when: _build_target | length == 0

    - name: Set full build command
      set_fact:
        build_cmd: "scripts/build.sh test test {{ _build_target }}"

- name: Build binary
  docker_container:
    image: node-cli-builder
    name: node-cli-builder
    detach: false
    volumes:
      - "{{ base_path }}/node-cli/dist:/app/dist"
    command: "{{ build_cmd }}"
  when:
    - build_type == "source"

- name: Copy source-built executable based on node type
  when: build_type == "source"
  block:
    - name: Determine source and destination paths for the executable
      set_fact:
        executable_paths: "{{ path_map[lookup_key] | default({}) }}"
      vars:
        base_node_type: "{{ 'mirage' if node_type == 'mirage_boot' else node_type }}"
        sync_suffix: "{{ 'sync' if (sync_node | default(false) | bool) else 'normal' }}"
        lookup_key: "{{ base_node_type }}_{{ sync_suffix }}"
        path_map:
          mirage_normal:
            src: "{{ base_path }}/node-cli/dist/skale-test-Linux-x86_64-mirage"
            dest: "/usr/local/bin/mirage"
          mirage_sync:
            src: "" # TODO: replace it with correct path "{{ base_path }}/node-cli/dist/skale-test-Linux-x86_64-mirage-sync"
            dest: "" # TODO: replace it with correct path "/usr/local/bin/mirage"
          skale_normal:
            src: "{{ base_path }}/node-cli/dist/skale-test-Linux-x86_64"
            dest: "/usr/local/bin/skale"
          skale_sync:
            src: "{{ base_path }}/node-cli/dist/skale-test-Linux-x86_64-sync"
            dest: "/usr/local/bin/skale"

    - name: Fail if executable paths could not be determined
      fail:
        msg: "Could not determine which executable to copy for node_type='{{ node_type }}' and sync_node='{{ sync_node | default('not defined') }}'."
      when: executable_paths | length == 0 or executable_paths.src == ""

    - name: Copy the correct executable to /usr/local/bin
      copy:
        remote_src: true
        src: "{{ executable_paths.src }}"
        dest: "{{ executable_paths.dest }}"
        mode: "0755"

- name: Remove builder container
  docker_container:
    state: absent
    name: node-cli-builder
  when:
    - build_type == "source"
