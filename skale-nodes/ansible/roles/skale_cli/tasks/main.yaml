- name: Download the CLI binary
  when: build_type == "git"
  tags: binary
  get_url:
    url: "{{ skale_cli_url if cli_type == 'skale' else fair_cli_url }}"
    dest: "/usr/local/bin/{{ cli_type }}"
    force: true
    mode: "0755"

- name: Build the CLI from source
  when: build_type == "source"
  block:
    - name: Build the node-cli builder image
      community.docker.docker_image_build:
        name: node-cli-builder
        path: "{{ base_path }}/node-cli"
        network: host
        rebuild: always

    - name: Build the CLI binary
      community.docker.docker_container:
        name: node-cli-builder
        image: node-cli-builder
        command: "bash scripts/build.sh test test {{ cli_type }}"
        volumes:
          - "{{ base_path }}/node-cli/dist:/app/dist"
        detach: false
        cleanup: true

    - name: Install the CLI binary
      copy:
        remote_src: true
        src: "{{ base_path }}/node-cli/dist/skale-test-Linux-x86_64{{ '-fair' if cli_type == 'fair' else '' }}"
        dest: "/usr/local/bin/{{ cli_type }}"
        mode: "0755"
