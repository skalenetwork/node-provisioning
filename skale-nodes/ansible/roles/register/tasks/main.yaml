- name: Register ip address
  set_fact:
    ip_address: "{{ hostvars[inventory_hostname].ansible_host }}"

- name: Run mirage boot register
  command:
    cmd: "{{ cli_command_name }} boot register -n {{ inventory_hostname }} --ip {{ ip_address }} -p 10000 -d {{ inventory_hostname }}.{{ base_domain_name }}"
  environment:
    LANG: en_US.utf-8
    LC_ALL: en_US.utf-8
  when: node_type is defined and node_type == "mirage"

- name: Run skale node register
  command:
    cmd: "{{ cli_command_name }} node register --name {{ inventory_hostname }} --ip {{ ip_address }} --port 10000 --domain {{ ip_address }}.{{ base_domain_name }}"
  environment:
    LANG: en_US.utf-8
    LC_ALL: en_US.utf-8
  when: node_type is not defined or node_type != "mirage"
