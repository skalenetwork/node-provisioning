- name: Get sgx container status
  command:
    cmd: "docker ps -a --filter name=sgx"
  register: sgx_status
  tags: deb

- debug:
    msg: "{{ sgx_status.stdout_lines }}"
  tags: deb

- name: Check whether the node is initialized
  stat:
    path: "{{ base_path }}/.skale"
  register: skale_dir
  tags: sgx

# sgx-data holds the keys of an initialized node. cleanup.yaml removes both to start over.
- name: Cleanup sgx folder
  file:
    state: absent
    path: "{{ base_path }}/sgx-data"
  when:
    - cleanup_sgx is defined and cleanup_sgx
    - not skale_dir.stat.exists
  tags: sgx

- name: Keep sgx-data of the initialized node
  debug:
    msg: "Not removing {{ base_path }}/sgx-data: the node is initialized. Run cleanup.yaml to start over."
  when:
    - cleanup_sgx is defined and cleanup_sgx
    - skale_dir.stat.exists
  tags: sgx

- name: Create sgx folder
  file:
    state: directory
    path: "{{ base_path }}/sgx-data"
  tags: sgx

- import_tasks: sgx_sim.yaml
  tags: sgx_container
  when: sgx_simulator is defined and sgx_simulator

- import_tasks: sgx.yaml
  tags: sgx_container
  when: sgx_simulator is not defined or not sgx_simulator
