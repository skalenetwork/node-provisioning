- name: Validate node_type
  fail:
    msg: >
      The 'node_type' variable must be defined and set to either 'skale' or 'fair'.
      Current value: '{{ node_type | default('undefined') }}'
  when: node_type is not defined or node_type not in ['skale', 'fair']

- name: Setting backup archive folder
  set_fact: backup_path="{{ base_path }}/backup"

- name: Set node command prefix
  set_fact:
    node_cmd_prefix: "{{ 'fair' if node_type == 'fair' else 'skale' }}"

- name: Turn off the node
  command:
    cmd: "{{ node_cmd_prefix }} node turn-off --yes"
  when: not no_downtime is defined or not no_downtime
  become: true

- name: Create backup archives
  become: true
  block:
    - name: Ensure backup path
      file:
        state: directory
        path: "{{ backup_path }}"

    - name: Create backup archive
      command:
        cmd: "{{ node_cmd_prefix }} node backup {{ backup_path }}"

    - name: Create sgx sim backup
      archive:
        path: "{{ base_path }}/sgx-data"
        dest: "{{ backup_path }}/sgx-data-{{ ansible_date_time.epoch }}.tar.gz"
        format: gz
      register: sgx_backup
      when: local_sgx_sim is defined and local_sgx_sim

  # Also when the backup fails, so the node isn't left turned off
  always:
    - name: Turn on the node back
      command:
        cmd: "{{ node_cmd_prefix }} node turn-on {{ base_path }}/init-env --yes"
      when: not no_downtime is defined or not no_downtime

- name: Find backup files
  find:
    path: "{{ backup_path }}"
    excludes: "sgx-data-*"
  register: backup_files

- name: Download backup archive
  fetch:
    src: "{{ (backup_files.files | sort(attribute='mtime', reverse=true) | first).path }}"
    dest: "artifacts/node-backup/{{ inventory_hostname }}/"
    flat: yes

- name: Download sgx sim backup
  fetch:
    src: "{{ sgx_backup.dest }}"
    dest: "artifacts/node-backup/{{ inventory_hostname }}/"
    flat: yes
  when: local_sgx_sim is defined and local_sgx_sim

- name: Download init-env
  fetch:
    src: "{{ base_path }}/init-env"
    dest: "artifacts/node-backup/{{ inventory_hostname }}/init-env"
    flat: yes

- name: Cleanup backup directory
  file:
    state: absent
    path: "{{ backup_path }}"
  become: true
