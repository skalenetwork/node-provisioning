- name: Set node_type to fair for migration
  set_fact:
    node_type: "fair"

- name: Fair migrate
  command:
    cmd: "fair node migrate {{ base_path }}/init-env --yes"
  register: migrate_cmd

# Right after the migration, so a later failure doesn't leave the nodes saved as boot nodes
- name: Stop saving node_type, the nodes are regular Fair nodes now
  import_role:
    name: generated_vars
    tasks_from: remove
  vars:
    generated_vars_drop: [node_type]

- name: Show migrate command output
  debug:
    msg: "{{ migrate_cmd.stdout }}"

- name: Clean up anvil resources
  delegate_to: "{{ groups['nodes'][0] }}"
  run_once: true
  when: anvil is defined and anvil
  tags: stop_anvil
  block:
    - name: Stop and remove anvil container
      docker_container:
        name: anvil
        state: absent

    - name: Remove anvil state directory
      file:
        path: /var/lib/anvil-state
        state: absent

- name: Forget the endpoint, key and contracts of the removed anvil
  import_role:
    name: generated_vars
    tasks_from: remove
  vars:
    generated_vars_drop: [endpoint, anvil_private_key, manager_contracts, ima_contracts]
  when: anvil is defined and anvil
  tags: stop_anvil

- name: Execute set_rng script
  script: set_rng.py
  environment:
    BASE_DIR: "files"
    ETH_PRIVATE_KEY: "{{ eth_private_key }}"
    ENDPOINT: "{{ boot_endpoint }}"
    FAIR_CONTRACTS: "{{ fair_contracts }}"
  args:
    executable: python3
  delegate_to: localhost
  run_once: true
  become: false
  tags: set_rng
