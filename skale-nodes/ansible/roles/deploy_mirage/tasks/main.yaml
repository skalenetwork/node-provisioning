- name: Deploy Mirage manager contracts (this may take a while, logs - {{ playbook_dir }}/logs/mirage-deploy.log)
  shell: bash {{ playbook_dir }}/../../helper-scripts/deploy_mirage.sh 2>&1 | tee {{ playbook_dir }}/logs/mirage-deploy.log
  run_once: yes
  environment:
    MIRAGE_TAG: "{{ mirage_tag }}"
    ETH_PRIVATE_KEY: "{{ eth_private_key }}"
    MAINNET_ENDPOINT: "{{ endpoint }}"
    ENDPOINT: "{{ mirage_endpoint }}"
    CHAIN_NAME: "{{ chain_name }}"
    TARGET: "{{ manager_contracts }}"
  tags: deploy_mirage

- name: Copy Mirage ABI
  copy:
    src: "{{ playbook_dir }}/../../helper-scripts/contracts_data/mirage.json"
    dest: "{{ playbook_dir }}/../../helper-scripts/contracts_data/mirageManagerComponents.json"
  tags: upload_mirage

- name: Ensure group vars all
  file:
    state: touch
    path: "{{ playbook_dir }}/group_vars/all"
  tags: upload_mirage

- name: Get Mirage Contract Address
  shell: "jq -r '.Committee' {{ playbook_dir }}/../../helper-scripts/contracts_data/mirage.json"
  register: mm_address_output
  changed_when: false
  tags: upload_mirage

- name: Save Mirage Contract Address to variable
  set_fact:
    mirage_contracts: "{{ mm_address_output.stdout }}"
  tags: upload_mirage

- name: Save Mirage Contract Address to group vars
  lineinfile:
    path: "{{ playbook_dir }}/group_vars/all"
    insertafter: EOF
    regexp: "^mirage_contracts:"
    line: 'mirage_contracts: "{{ mirage_contracts }}"'
    state: present
  tags: upload_mirage
