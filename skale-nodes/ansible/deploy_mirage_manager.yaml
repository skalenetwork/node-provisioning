- name: Deploy Mirage manager contracts
  hosts: 127.0.0.1
  connection: local
  pre_tasks:
    - name: Fail if node_type is not 'mirage_boot'
      fail:
        msg: "Stopping playbook. This play requires node_type to be 'mirage_boot', but it is '{{ node_type }}'."
      when: node_type != "mirage_boot"
  roles:
    - role: deploy_mirage
      tags:
        - deploy_mirage


