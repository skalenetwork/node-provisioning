# The config role checks that the addresses are set
- name: Propagate contract addresses to nodes
  hosts: nodes,archive
  gather_facts: no
  tasks:
    - name: Set manager_contracts and ima_contracts facts for each node
      set_fact:
        manager_contracts: "{{ hostvars['localhost']['manager_contracts'] | default(manager_contracts | default(''), true) }}"
        ima_contracts: "{{ hostvars['localhost']['ima_contracts'] | default(ima_contracts | default(''), true) }}"

- name: Setup skale node
  hosts: nodes,archive
  become: true
  roles:
    - role: sync
      tags: sync
      when: build_type == "source"

    - role: skale_cli
      tags: cli

    - role: config
      tags: config

    - role: init
      tags: init


- name: Reconfigure firewall rules
  hosts: geth
  become: true
  tasks:
    - name: Configure geth iptables
      import_role:
        name: geth
        tasks_from: firewall
      tags: firewall
